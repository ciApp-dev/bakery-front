@if (confirmDialogService.isOpen()) {
<div
  class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/60 px-4 backdrop-blur-sm animate-in fade-in duration-200"
  (click)="onBackdropClick()"
>
	<section
		class="w-full max-w-md rounded-2xl border border-slate-200/70 bg-white p-5 shadow-2xl animate-in zoom-in-95 slide-in-from-bottom-2 duration-200 dark:border-slate-700 dark:bg-slate-900"
		role="dialog"
		aria-modal="true"
		aria-live="assertive"
		(click)="$event.stopPropagation()"
	>
		<header class="mb-4">
			<h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100">{{ confirmDialogService.config().title }}</h2>
			<p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-300">{{ confirmDialogService.config().message }}</p>
		</header>

		<div class="flex justify-end gap-2">
			<button
				type="button"
				class="rounded-lg bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-800 transition hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-100 dark:hover:bg-slate-600"
				(click)="onCancel()"
			>
				{{ confirmDialogService.config().cancelLabel }}
			</button>

			@if (confirmDialogService.config().destructive) {
				<button
					type="button"
					class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700"
					(click)="onConfirm()"
				>
					{{ confirmDialogService.config().confirmLabel }}
				</button>
			} @else {
				<button
					type="button"
					class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200"
					(click)="onConfirm()"
				>
					{{ confirmDialogService.config().confirmLabel }}
				</button>
			}
		</div>
	</section>
</div>
}
