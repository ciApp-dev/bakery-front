<section class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-lg shadow {{darkModeDiv}}">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
      <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl {{darkModeText}}">
        Ingresar a tu cuenta
      </h1>
      <form class="space-y-4 md:space-y-6" action="#" (submit)="loggin($event)">
        <div>
          <app-input-solo [inputId]="'login_email'" [placeHolder]="'nombre@empresa.com'"
            (valueChange)="onEmailChange($event)"></app-input-solo>
        </div>
        <div>
          <label for="login_password"
            class="block mb-2 text-sm font-medium text-gray-900 {{darkModeText}}">Password</label>
          <div class="relative">
            <app-input-pass-solo [inputId]="'login_password'"
              (valueChange)="onPasswordChange($event)"></app-input-pass-solo>
          </div>
        </div>
        <button type="submit"
          class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
          Iniciar Sesión
        </button>
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          ¿Aún no tienes cuenta?
          <a [routerLink]="'/register'"
            class="font-medium text-blue-600 hover:underline dark:text-blue-500 cursor-pointer">Regístrate aquí</a>
        </p>
      </form>
    </div>
  </div>
</section>
