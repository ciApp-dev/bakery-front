
	<div class="mx-auto w-full max-w-7xl">
		<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
			<div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
				
				<div class="w-full sm:max-w-2xl lg:max-w-3xl">
					<app-input-search-form></app-input-search-form>
				</div>

				<app-button-main-form label="Agregar" iconName="add" (pressed)="showCreateSection.set(true)"></app-button-main-form>
			</div>
		</div>

		@if (showCreateSection()) {
			<div class="create-panel-enter mt-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
				<div class="mb-4 flex items-center justify-between">
				
                    <app-label-form label="{{ modeForm() }}"></app-label-form>
					
                    
                    
                </div>

				<div class="grid gap-3 sm:grid-cols-3">
					
					<app-input-form label="Nombre" placeholder="Nombre del producto" type="text" [value]="name()" (valueChange)="onNameChange($event)"></app-input-form>
                    
                    <app-input-form label="Codigo" placeholder="SKU-00" type="text" [value]="code()" (valueChange)="onCodeChange($event)"></app-input-form>

					<div class="sm:row-span-2">
						<app-input-form label="Descripción" placeholder="Descripción del producto" type="textarea" [value]="description()" (valueChange)="onDescriptionChange($event)"></app-input-form>
					</div>

					<app-selector-form [options]="options()" [value]="idCategory()" label="Categoria" placeholder="Seleccione una categoría" (valueChange)="idCategory.set($event)"></app-selector-form>

					<app-input-form label="Precio" placeholder="0.00" type="decimal" [value]="price()" (valueChange)="onPriceChange($event)"></app-input-form>

                   
				</div>

                <div class="mt-4 flex justify-end gap-2">
                    <app-button-secundary-form color="text-red-500" label="Cancelar" iconName="close" (pressed)="cancelSave()"></app-button-secundary-form>
                    <app-button-main-form label="Guardar" iconName="save" (click)="saveProduct()"></app-button-main-form>
                </div>

			</div>
		}

		<div class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
			<div class="border-b border-slate-200 px-4 py-3 dark:border-slate-800">
				<app-label-form label="Productos"></app-label-form>
			</div>

            <app-table-form label="Productos" [contentLabel]="productName" [content]="productRows" (editSelected)="editProduct($event)"></app-table-form>
			
		</div>
	</div>
