<input [id]="inputId()" [type]="showPassword() ? 'text' : 'password'" (input)="onInput($event)" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 pr-10 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required="">
<app-pass-inputs-button [showPassword]="showPassword()" (showPasswordChange)="showPassword.set($event)"></app-pass-inputs-button>
