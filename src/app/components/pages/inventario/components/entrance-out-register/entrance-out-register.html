<div class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800/50">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300">Registro de {{ titleLabel() }}
    </h2>

    <div class="mt-3 grid gap-3 sm:grid-cols-2">

        <div>
        <app-selector-form label="Producto"
         placeholder="Seleccione un producto"
         [value]="form.controls['idProducto'].value"
         [options]="optionsProducts()"
         (valueChange)="onProductSelected($event)"
         ></app-selector-form>
        @if (form.controls['idProducto'].invalid && form.controls['idProducto'].touched) {
            <p class="mt-1 text-xs text-red-600">Seleccione un producto</p>
        }
        </div>

        <div>
                <span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Stock disponible</span>
                <app-label-medium label="{{ localStock() }} disponibles"></app-label-medium>

            </div>

        <div>
        <app-input-form label="Cantidad"
         placeholder="Cantidad de producto"
         type="number"
         (valueChange)="onCantidadChange($event)"
         [value]="form.controls['cantidad'].value"
         ></app-input-form>
        @if (form.controls['cantidad'].invalid && form.controls['cantidad'].touched) {
            <p class="mt-1 text-xs text-red-600">Ingrese una cantidad válida</p>
        }
        </div>

    
    </div>


    
        <app-input-form
        label="Nota"
         placeholder="Agrega una nota"
         type="textarea"
         (valueChange)="onMotivoChange($event)"
         [value]="motivo()"
         ></app-input-form>
    

    <div class="mt-4 flex flex-wrap justify-end gap-2">
      
        
        <app-button-secundary-form 
        color="text-red-500"
        label="Cancelar" (click)="cancel()"
        iconName="cancel"
        ></app-button-secundary-form>

        <app-button-main-form
        label="Guardar {{ titleLabel() }}"
        iconName="save"
        (click)="save()"
        ></app-button-main-form>

    </div>
</div>
