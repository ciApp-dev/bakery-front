<section class="checkout-shell mx-auto w-full max-w-[1500px] p-4 sm:p-5">
	<header class="mb-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
		<p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Caja</p>
		<h1 class="text-2xl font-black text-slate-900 dark:text-slate-100">Control de Checkout</h1>
		<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">
			Diseno base para movimientos, historial de registros y cierre de actividades.
		</p>
	</header>

	<div class="grid gap-4 xl:grid-cols-2">
		@if (cashId() !== null) {
        <app-in-register [cashId]="cashId()!" (refresh)="refreshRegisters($event)"></app-in-register>
		<app-out-register [cashId]="cashId()!" [cashAmount]="cashAmount()" (refresh)="refreshRegisters($event)"></app-out-register>
		} @else {
			<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400">
				Cargando ID de efectivo...
			</div>
			<div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400">
				Cargando ID de efectivo...
			</div>
		}
        
	</div>

    <section class="mt-4">

	<app-registers-checkout [content]="allRegisters()" [contentLabel]="labelTableRegisters"></app-registers-checkout>

    </section>
    
	<section class="mt-4 grid gap-4 xl:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)]">
		<app-sumary-checkout [chashAmount]="cashAmount() " [inputAmount]="inputAmount() " [outputAmount]="outputAmount()" [sales]="sales()" [transactions]="transactions()" [canceledSales]="canceledSales()" [canceledTransactions]="canceledTransactions()"></app-sumary-checkout>

		<app-end-register [cashAmount]="cashAmount()"></app-end-register>
	</section>
</section>
