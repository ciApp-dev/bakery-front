<section class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div
    class="w-full max-w-md bg-white rounded-lg shadow dark:border md:mt-0 xl:p-0 dark:bg-gray-800 dark:border-gray-700">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
      <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
        Crea tu cuenta
      </h1>
      <form class="max-w-md" (submit)="createAccount($event)">
        <div class="relative z-0 w-full mb-5 group">
          <app-input-label
            [label]="'Email'"
            [inputId]="'register_email'"
            [typeVar]="'email'"
            (valueChange)="onEmailChange($event)"
          ></app-input-label>
        </div>
        <div class="relative z-0 w-full mb-5 group">
          <app-input-pass
            [label]="'Contraseña'"
            [inputId]="'register_password'"
            (valueChange)="onPasswordChange($event)"
          ></app-input-pass>
          
        
        </div>
        <div class="relative z-0 w-full mb-5 group">

          <app-input-pass
            [label]="'Confirmar contraseña'"
            [inputId]="'register_password_confirmation'"
            (valueChange)="onPasswordConfirmationChange($event)"
          ></app-input-pass>  

        </div>
        <div class="grid md:grid-cols-2 md:gap-6">
          <div class="relative z-0 w-full mb-5 group">
            <app-input-label
              [label]="'Nombre'"
              [inputId]="'register_name'"
              [typeVar]="'text'"
              (valueChange)="onNameChange($event)"
            ></app-input-label>
          </div>
          <div class="relative z-0 w-full mb-5 group">
            <app-input-label
              [label]="'Apellido'"
              [inputId]="'register_lastname'"
              [typeVar]="'text'"
              (valueChange)="onLastNameChange($event)"
            ></app-input-label>
            
          </div>
        </div>

        <button
          (click)="createAccount($event)"
           type="submit"
          class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
          >Crear
          cuenta</button>
          <p></p>
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          ¿Ya tienes una cuenta? 
          <a [routerLink]="'/login'" class="font-medium text-blue-600 hover:underline dark:text-blue-500 cursor-pointer">Inicia sesión aquí</a>
        </p>
      </form>
    </div>
  </div>
</section>
