@if (isOpen()) {
<div
	class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/60 px-4 backdrop-blur-sm animate-in fade-in duration-200"
	(click)="onBackdropClick()"
>
	<section
		class="w-full max-w-md rounded-2xl border border-slate-200/70 bg-white p-5 shadow-2xl animate-in zoom-in-95 slide-in-from-bottom-2 duration-200 dark:border-slate-800 dark:bg-slate-900"
		role="dialog"
		aria-modal="true"
		aria-labelledby="activity-start-title"
		(click)="$event.stopPropagation()"
	>
		<header class="mb-4">
			<h2 id="activity-start-title" class="text-lg font-semibold text-slate-900 dark:text-slate-100">{{ title() }}</h2>
			<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{ subtitle() }}</p>
		</header>

		<div>
           <app-selector-form
                [label]="'Actividad'"
                [placeholder]="'Selecciona una opción'"
                [options]="optionsActivity()"
                (valueChange)="onActivityChange($event)"

            ></app-selector-form>

            
            <div></div>
            @if(activitySelected() == 1){
				<app-new-activity (completed)="onActivityTaskCompleted()"></app-new-activity>
            }@else if(activitySelected() == 2){
				<app-join-activity (completed)="onActivityTaskCompleted()"></app-join-activity>
            }

            
        </div>

	</section>
</div>
}
