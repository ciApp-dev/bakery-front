<label class="block">
    <span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">{{ label() }}</span>
    @if (type()==="decimal"){
    <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="0.00"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        [disabled]="disabled()"
        [class]="'w-full rounded-xl ' + (color() ?? '') + ' bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500  '" />
    }

    @if (type()==="number"){
    <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        [disabled]="disabled()"
        [class]="'w-full rounded-xl ' + (color() ?? '') + ' bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500  '" />
    }

    @if(type()==="textarea"){
    <textarea
        rows="4"
        placeholder="{{ placeholder() }}"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        [disabled]="disabled()"
        [class]="'w-full rounded-xl ' + (color() ?? '') + ' bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500  '"
    ></textarea>
    }

    @if(type()==="password"){
        <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" placeholder="{{ placeholder() }}"
            [value]="valueAsText()"
            (input)="onValueChange($event)"
            [disabled]="disabled()"
            [class]="'w-full rounded-xl ' + (color() ?? '') + ' bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500  '" 
            >
        <app-pass-inputs-button [showPassword]="showPassword()" (showPasswordChange)="showPassword.set($event)"></app-pass-inputs-button>
        </div>
        
    }   

    @if(type()!=="decimal" && type()!=="number" && type()!=="textarea" && type()!=="password"){
    <input type="text" inputmode="text" placeholder="{{ placeholder() }}"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        [disabled]="disabled()"
        [class]="'w-full rounded-xl ' + (color() ?? '') + ' bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500  '" />
    }
    
</label>
