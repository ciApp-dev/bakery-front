<div class="min-h-screen bg-slate-100 text-slate-800 dark:bg-gray-800 dark:border-gray-700" >


	<app-button-sidemenu [showSidebar]="isSidebarOpen()" (isSidebarOpenChange)="isSidebarOpen.set($event)"></app-button-sidemenu>

	@if (isSidebarOpen()) {
		<app-button-sidemenu-trick [showSidebar]="isSidebarOpen()" (isSidebarOpenChange)="isSidebarOpen.set($event)"></app-button-sidemenu-trick>	
	}

	<aside
		class="fixed inset-y-0 left-0 z-40 w-72 border-r border-slate-200 bg-white transition-transform duration-300"
		[class.-translate-x-full]="!isSidebarOpen()"
		[class.translate-x-0]="isSidebarOpen()"
		aria-label="Navegacion principal"
	>
		<div class="flex h-full flex-col p-5">
			
			<app-header-sidemenu [nameSucursal]="nameSucursal()"></app-header-sidemenu>

			<app-option-sidemenu [IsSidebarOpen]="isSidebarOpen()" (IsSidebarOpenChange)="isSidebarOpen.set($event)"></app-option-sidemenu>


				<div class="mt-auto rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4">
					<app-footer-sidemenu></app-footer-sidemenu>
				</div>
		</div>
	</aside>

	<div
		class="relative min-h-screen transition-[margin] duration-300"
		[class.lg\:ml-72]="isSidebarOpen()"
		[class.lg\:ml-0]="!isSidebarOpen()"
	>
		<main class="mx-auto max-w-7xl p-4 sm:p-6">
			<header class="mb-6 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
				<div class="flex flex-wrap items-start justify-between gap-4">
					<div class="space-y-2">
						<span class="inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">28 de mayo de 2026</span>
						<h2 class="text-2xl font-black tracking-tight text-slate-900 sm:text-3xl">Panel Operativo</h2>
						<p class="text-sm text-slate-500 sm:text-base">El contenido central se carga con rutas hijas para que cada seccion tenga su propio componente.</p>
					</div>

					<div class="flex items-center gap-2 sm:gap-3">
						
						
						<app-dropdown-form label="Cambiar Sucursal" 
						[options]="sucursales()" 
						(valueChange)="onSucursalChange($event)"></app-dropdown-form>
					
						
					</div>
				</div>
			</header>

			<router-outlet></router-outlet>
		</main>
	</div>

	<app-activity-start
		[isOpen]="isActivityStartOpen()"
		[options]="activityOptions"
		(start)="onActivityStart($event)"
		(cancel)="onActivityCancel()"
	></app-activity-start>
</div>
