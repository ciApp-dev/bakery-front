<div id="toast-success"
    class="flex w-full max-w-sm items-center rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-emerald-800 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_20px_40px_-14px_rgba(0,0,0,0.28)] dark:border-emerald-800 dark:bg-emerald-950/90 dark:text-emerald-100 {{darkModeToast}}"
    role="alert">
    <div class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-900/70 dark:text-emerald-300">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 11.917 9.724 16.5 19 7.5" />
        </svg>
        <span class="sr-only text-emerald-700">Check icon</span>
    </div>
    <div class="ms-3 text-sm font-medium text-emerald-800 dark:text-emerald-100">{{ message() }}</div>
    <button type="button"
        class="ms-auto flex h-8 w-8 items-center justify-center rounded-lg border border-emerald-200 bg-emerald-100 text-emerald-700 transition-colors hover:border-emerald-300 hover:bg-emerald-200 hover:text-emerald-900 focus:outline-none focus:ring-4 focus:ring-emerald-300 dark:border-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-200 dark:hover:border-emerald-500 dark:hover:bg-emerald-800 dark:hover:text-white dark:focus:ring-emerald-900"
        aria-label="Close" (click)="closeToast()">
        <span class="sr-only">Close</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18 17.94 6M18 18 6.06 6" />
        </svg>
    </button>
</div>
