<button
    type="button"
    (click)="onPress()"
    class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/30 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200 dark:focus:ring-slate-100/30"
>
    @if (iconName()) {
        <span class="material-symbols-outlined button-main-form-icon" aria-hidden="true">{{iconName()}}</span>
    }

    <span>{{ label() }}</span>
</button>
