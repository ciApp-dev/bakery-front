<div class="dropdown-form">
  <button
    id="dropdownHoverButton"
    type="button"
    (click)="toggleDropdown($event)"
    class="dropdown-form__button"
  >
    <span class="truncate">{{ label() }}</span>
    <svg class="dropdown-form__icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/>
    </svg>
  </button>

  <!-- Dropdown menu -->
  <div
    id="dropdownHover"
    class="dropdown-form__menu"
    [class.hidden]="!isOpen()"
    (click)="$event.stopPropagation()"
  >
    <ul class="dropdown-form__list" aria-labelledby="dropdownHoverButton">
      @for (option of options(); track option.id) {
        <li>
          <button
            type="button"
            class="dropdown-form__option"
            (click)="selectedOption(option)"
          >
            {{ option.nombre }}
          </button>
        </li>
      } @empty {
        <li class="dropdown-form__empty">No se encontraron opciones</li>
      }
    </ul>
  </div>
</div>
