@if (loadingService.isLoading()) {
<div
	class="loading-overlay"
	role="status"
	aria-live="polite"
	aria-busy="true"
>
	<div class="loading-card">
		<div class="bakery-scene" aria-hidden="true">
			<div class="sparkle sparkle-1"></div>
			<div class="sparkle sparkle-2"></div>
			<div class="sparkle sparkle-3"></div>

			<div class="oven">
				<div class="oven-window">
					<div class="steam steam-1"></div>
					<div class="steam steam-2"></div>
					<div class="steam steam-3"></div>
				</div>
			</div>

			<div class="path"></div>

			<div class="bread-runner">
				<div class="bread-face">
					<span class="eye eye-left"></span>
					<span class="eye eye-right"></span>
					<span class="smile"></span>
				</div>
				<span class="leg leg-left"></span>
				<span class="leg leg-right"></span>
			</div>
		</div>

		<div class="loading-copy">
			<p class="loading-title">Horneando...</p>
			<p class="loading-subtitle">Tu solicitud se esta procesando</p>
		</div>
	</div>
</div>
}
