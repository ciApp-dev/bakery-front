
		<div class="grid gap-4 lg:grid-cols-[360px_minmax(0,1fr)]">
	

             <span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300"></span>
			<app-toggle-switch
				[checked]="showDeleted()"
				label="Mostrar eliminados"
				(checkedChange)="onShowDeletedChange($event)"
			></app-toggle-switch>
		

	
			<article class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-800/50">
				<h2 class="text-sm font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300">{{ formTitle() }}</h2>

				<div class="mt-4 space-y-4">
					<app-input-form
						label="Nombre del rol"
						placeholder="Ej. Administrador"
						type="text"
						(valueChange)="onNameChange($event)"
						[value]="nameInput()"
					></app-input-form>

					<app-input-form
						label="Descripción"
						placeholder="Describe los permisos o responsabilidades del rol"
						type="textarea"
						(valueChange)="onDescriptionChange($event)"
						[value]="descriptionInput()"
					></app-input-form>

					<span class="block h-px w-full bg-slate-200 dark:bg-slate-700" aria-hidden="true"></span>

					<div class="flex flex-col-reverse gap-2 sm:flex-row">
						
						<button
							type="button"
							(click)="saveCategory()"
							class="flex-1 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white transition hover:bg-emerald-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2"
						>
							{{ submitLabel() }}
						</button>

                        @if (isEditing()) {
							<button
								type="button"
								(click)="cancelEdit()"
								class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
							>
								Cancelar
							</button>
						}
					</div>

					@if (feedback()) {
						<p class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-medium text-amber-700 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300" role="status">
							{{ feedback() }}
						</p>
					}
				</div>
			</article>

			<app-list-form
				[showDeleted]="showDeleted()"
				[labelBtn1]="'Editar'"
				[labelBtn2]="lblBtn2()"
				[iconBtn1]="'edit'"
				[iconBtn2]="iconBtn2()"
				[colorBtn1]="'text-yellow-500'"
				[colorBtn2]="colorBtn2()"
				(editSelected)="startEdit($event)"
				(deleteSelected)="removeCategory($event)"
				[content]="roles()"
			></app-list-form>
		
		</div>
