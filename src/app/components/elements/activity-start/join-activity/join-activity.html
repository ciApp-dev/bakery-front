<div class="mt-4 border border-slate-200/70 p-4 rounded-2xl sm:-5">

<div>
    <app-selector-form
        [label]="'Caja a unirse'"
        [placeholder]="'Selecciona una caja'"
        [options]="optionRegister()"
        (valueChange)="onRegisterSelected($event)"
    ></app-selector-form>
    @if(form.controls['register'].invalid && form.controls['register'].touched) {
        <p class="mt-1 text-xs text-red-600">Seleccione una caja</p>
    }

    <app-input-form
        [label]="'Contraseña de la caja'"
        [placeholder]="'Ingresa la contraseña'"
        [type]="'password'"
        (valueChange)="onPasswordChange($event)"
    ></app-input-form>
    @if(form.controls['password'].invalid && form.controls['password'].touched) {
        <p class="mt-1 text-xs text-red-600">La contraseña es requerida</p>
    }


</div>
<div class="mt-4 flex gap-2">
    <app-button-main-form
        [label]="'Unirse a la caja'"
        [iconName]="'join'"
        (pressed)="joinActivity()"        
    ></app-button-main-form>
</div>

    
</div>
