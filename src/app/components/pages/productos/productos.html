
	<div class="mx-auto w-full max-w-7xl">
		<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
			<div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
				
				<div class="w-full sm:max-w-2xl lg:max-w-3xl">
					<app-input-search-form></app-input-search-form>
				</div>

				<app-button-main-form label="Agregar" iconName="add" (pressed)="showCreateSection.set(true)"></app-button-main-form>
			</div>
		</div>

		@if (showCreateSection()) {
			
			<div>
			<div class="create-panel-enter mt-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-5">
				<div class="mb-4 flex items-center justify-between">
				
                    <app-label-form label="{{ modeForm() }}"></app-label-form>
					
                    
                    
                </div>

				<div class="grid gap-3 sm:grid-cols-3">
					
					<div>
						<app-input-form 
						label="Nombre" 
						placeholder="Nombre del producto" 
						type="text" [value]="name()"
						(valueChange)="onNameChange($event)" 
						[required]="true"
						(errorEstatus)="errorEstatus()"></app-input-form>
						
					</div>
                    
					<div>
						<app-input-form label="Codigo" placeholder="SKU-00" type="text" [value]="code()" (valueChange)="onCodeChange($event)" [required]="true"></app-input-form>
						
					</div>

					<div class="sm:row-span-2">
						<app-input-form label="Descripción" placeholder="Descripción del producto" type="textarea" [value]="description()" (valueChange)="onDescriptionChange($event)" [required]="true"></app-input-form>
						
					</div>

					<div>
						<app-selector-form [options]="options()" [value]="idCategory()" label="Categoria" placeholder="Seleccione una categoría" (valueChange)="onCategoryChange($event)"></app-selector-form>
						@if (categoryError()) {
							<p class="mt-1 text-xs text-red-600">{{ categoryError() }}</p>
						}
					</div>

					<div>
						<app-input-form label="Precio" placeholder="Precio del producto" type="decimal" [value]="price()" (valueChange)="onPriceChange($event)" [required]="true"></app-input-form>
						
					</div>
                   
				</div>

                <div class="mt-4 flex justify-end gap-2">
                    <app-button-secundary-form color="text-red-500" label="Cancelar" iconName="close" (pressed)="cancelSave()"></app-button-secundary-form>
					<app-button-main-form label="Guardar" iconName="save" (pressed)="saveProduct()"></app-button-main-form>
                </div>

			</div>
			</div>
		}

		<div class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
			<div class="border-b border-slate-200 px-4 py-3 dark:border-slate-800">
				<app-label-form label="Productos"></app-label-form>
			</div>

            <app-table-form label="Productos" [contentLabel]="productName" [content]="tableContent()" (editSelected)="editProduct($event)" (deleteSelected)="requestDeleteProduct($event)"></app-table-form>
			
		</div>
	</div>
