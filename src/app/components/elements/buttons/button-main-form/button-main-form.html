<button
    type="button"
    (click)="onPress()"
    [class]="'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition focus:outline-none focus:ring-2 focus:ring-slate-900/30 dark:text-slate-900 dark:focus:ring-slate-100/30 ' + buttonClasses() + ''"
>
    @if (iconName()) {
        <span class="material-symbols-outlined button-main-form-icon" aria-hidden="true">{{iconName()}}</span>
    }

    <span>{{ label() }}</span>
</button>
