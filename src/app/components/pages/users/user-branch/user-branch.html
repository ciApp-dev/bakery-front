<section class="mx-auto w-full max-w-7xl" aria-labelledby="user-branch-title">
	<header class="mb-4">
		<h1 id="user-branch-title" class="text-xl font-bold text-slate-900 dark:text-slate-100">Sucursales del usuario</h1>
		<p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Administra las sucursales asignadas a este usuario.</p>
	</header>

	<div class="grid gap-4 lg:grid-cols-[360px_minmax(0,1fr)]">
		<article class="h-fit rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-900">
			<h2 class="text-sm font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300">Asignar sucursal</h2>
			<div class="mt-4 space-y-4">
				<app-selector-form
					[options]="branchOptions"
					[value]="selectedBranchId()"
					label="Sucursal"
					placeholder="Selecciona una sucursal"
					(valueChange)="onBranchSelected($event)"
				></app-selector-form>

				<app-button-main-form
					class="block w-full"
					label="Asignar sucursal"
					iconName="add"
					(pressed)="assignBranch()"
				></app-button-main-form>
			</div>
		</article>

		<app-list-form
			[showDeleted]="showDeleted()"
			[labelBtn1]="'Ver'"
			[labelBtn2]="'Quitar'"
			[iconBtn1]="'visibility'"
			[iconBtn2]="'delete'"
			[colorBtn1]="'text-sky-600'"
			[colorBtn2]="'text-red-500'"
			[content]="assignedBranches()"
			(editSelected)="onViewBranch($event)"
			(deleteSelected)="onRemoveBranch($event)"
		></app-list-form>
	</div>
</section>
