<button
						type="button"
						(click)="onPress()"
						class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800 cursor-pointer"
					>
                    @if (iconName()) {
                        <span class="material-symbols-outlined button-secundary-form-icon text-[1em] leading-none {{ color() }}" aria-hidden="true">{{ iconName() }}</span>
                    }
						<span>{{ label() }}</span>
					</button>
