<article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
			<h2 class="mb-3 text-lg font-black text-slate-900 dark:text-slate-100">Resumen de Actividad</h2>

			<div class="grid gap-3 sm:grid-cols-2">
				<div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Ventas</p>
					<p class="mt-1 text-xl font-black text-emerald-700 dark:text-emerald-300">$ {{ sales() }}</p>
				</div>

                <div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Transacciones</p>
					<p class="mt-1 text-xl font-black text-emerald-700 dark:text-emerald-300">{{ transactions() }}</p>
				</div>

                <div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Ventas Canceladas</p>
					<p class="mt-1 text-xl font-black text-rose-900 dark:text-rose-300">$ {{ canceledSales() }}</p>
				</div>

                <div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Transacciones Canceladas</p>
					<p class="mt-1 text-xl font-black text-rose-900 dark:text-rose-300">{{ canceledTransactions() }}</p>
				</div>


				<div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Entradas</p>
					<p class="mt-1 text-xl font-black text-emerald-700 dark:text-emerald-300">$ {{ inputAmount() }}</p>
				</div>

				<div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Salidas</p>
					<p class="mt-1 text-xl font-black text-rose-700 dark:text-rose-300">$ {{ outputAmount() }}</p>
				</div>

				<div class="summary-card">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Efectivo Esperado</p>
					<p class="mt-1 text-xl font-black text-amber-700 dark:text-amber-300">$ {{ chashAmount() }}</p>
				</div>
			</div>
		</article>
