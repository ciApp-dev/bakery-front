<router-outlet></router-outlet>

<app-loading-screen></app-loading-screen>
<app-confirm-dialog></app-confirm-dialog>

<div class="pointer-events-none fixed bottom-6 left-1/2 z-50 w-full max-w-sm -translate-x-1/2 px-4">
	<div class="flex flex-col gap-3">
		@for (toast of toastService.toasts(); track toast.id) {
			<div class="pointer-events-auto">
				<app-toast-successfully
					[message]="toast.message"
					(closed)="closeToast(toast.id)"
				></app-toast-successfully>
			</div>
		}

		@for (toast of toastService.errorToasts(); track toast.id) {
			<div class="pointer-events-auto">
				<app-toast-wrong
					[message]="toast.message"
					[messageDetails]="toast.messageDetails"
					(closed)="closeToast(toast.id)"
				></app-toast-wrong>
			</div>
		}
	</div>
</div>
