<section class="pos-shell mx-auto w-full max-w-[1600px] p-3 {{ darkModeDiv }}">
	<div
		class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
		<header class="border-b border-slate-200 bg-slate-50 px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
			<div class="mb-2 flex flex-wrap items-center gap-2">
				@for (tab of saleTabs(); track tab.id) {
				<div class="flex items-center rounded-lg border px-1"
					[class]="activeTabId() === tab.id ? 'border-amber-400 bg-amber-50 dark:border-amber-500/40 dark:bg-amber-500/10' : 'border-slate-300 bg-white dark:border-slate-600 dark:bg-slate-900'">
					<button type="button" (click)="selectTab(tab.id)" class="px-2 py-1 text-xs font-semibold"
						[class]="activeTabId() === tab.id ? 'text-amber-700 dark:text-amber-300' : 'text-slate-600 dark:text-slate-300'">
						{{ tab.title }}
					</button>
					<button type="button" (click)="closeTab(tab.id)" [disabled]="saleTabs().length === 1"
						class="rounded-md px-2 py-1 text-xs text-slate-400 transition hover:bg-red-100 hover:text-red-600 disabled:cursor-not-allowed disabled:opacity-40 dark:hover:bg-red-500/20">
						x
					</button>
				</div>
				}

				<button type="button" (click)="addTab()"
					class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
					+ Nueva venta
				</button>
			</div>


			<div class="grid gap-2 lg:grid-cols-[minmax(0,1fr)_300px]">
				<label class="relative block">
					<svg class="pointer-events-none absolute left-3 top-2.5 h-5 w-5 text-slate-400" viewBox="0 0 24 24"
						fill="none" xmlns="http://www.w3.org/2000/svg">
						<path
							d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
							stroke="currentColor" stroke-width="2" />
						<path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
					</svg>
					<input type="text" [value]="searchText()" (input)="setSearch($any($event.target).value)"
						placeholder="Buscar producto por nombre..."
						class="block w-full rounded-lg border border-slate-300 bg-white py-2 pl-10 pr-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-amber-500 focus:ring-amber-500 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
				</label>

				<div class="flex items-center justify-end">
					<span
						class="rounded-lg bg-amber-100 px-3 py-2 text-sm font-semibold text-amber-700 dark:bg-amber-500/20 dark:text-amber-300">Punto
						de venta</span>
				</div>
			</div>
		</header>
		
		<app-main-pos [tab]="activeTab()" (tabPatch)="onActiveTabPatch($event)" (saleSubmit)="sendSale()" [categories]="categories()" [catalogo]="catalogo()" [paymentMethodOptions]="paymentMethodOptions()" [resetPayment]="resetPayment()"></app-main-pos>
	</div>
</section>
