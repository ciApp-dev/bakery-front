<section class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center">
  <div
    class="w-full max-w-md bg-white rounded-lg shadow dark:border md:mt-0 xl:p-0 dark:bg-gray-800 dark:border-gray-700">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
      <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
        Crea tu cuenta
      </h1>
      <form class="max-w-md">
        <div class="relative z-0 w-full mb-5 group">
          <app-input-label [label]="'Email'" [typeVar]="'email'"></app-input-label>
        </div>
        <div class="relative z-0 w-full mb-5 group">

          <app-input-pass [label]="'Contraseña'" ></app-input-pass>
        
        </div>
        <div class="relative z-0 w-full mb-5 group">
         
          <app-input-pass [label]="'Confirmar contraseña'" ></app-input-pass>  

        </div>
        <div class="grid md:grid-cols-2 md:gap-6">
          <div class="relative z-0 w-full mb-5 group">
            <input type="text" name="floating_first_name" id="floating_first_name"
              class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer dark:text-white dark:border-gray-600 dark:focus:border-fg-brand"
              placeholder=" " required />
            <label for="floating_first_name"
              class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto dark:text-white">
              Nombre</label>
          </div>
          <div class="relative z-0 w-full mb-5 group">
            <input type="text" name="floating_last_name" id="floating_last_name"
              class="block py-2.5 px-0 w-full text-sm text-heading bg-transparent border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer dark:text-white dark:border-gray-600 dark:focus:border-fg-brand"
              placeholder=" " required />
            <label for="floating_last_name"
              class="absolute text-sm text-body duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto dark:text-white">Apellido</label>
          </div>
        </div>

        <button type="submit"
          class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Crear
          cuenta</button>
          <p></p>
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          ¿Ya tienes una cuenta? 
          <a [routerLink]="'/login'" class="font-medium text-blue-600 hover:underline dark:text-blue-500 cursor-pointer">Inicia sesión aquí</a>
        </p>
      </form>
    </div>
  </div>
</section>
