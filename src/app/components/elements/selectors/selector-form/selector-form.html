<label class="block">
  <span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">{{ label() }}</span>
  <div class="relative">
    <input
      type="text"
      [value]="query()"
      [placeholder]="placeholder()"
      autocomplete="off"
      class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 pr-10 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-slate-200 dark:focus:ring-slate-200/20"
      (input)="onQueryInput($event)"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      (keydown.escape)="closeOptions()"
    />

    @if (query().trim().length > 0) {
      <button
        type="button"
        class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-1 text-slate-500 transition hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200"
        aria-label="Clear text"
        (mousedown)="$event.preventDefault()"
        (click)="clearQuery()"
      >
        <span class="material-symbols-outlined text-base leading-none" aria-hidden="true">close</span>
      </button>
    }

    @if (isOpen()) {
      <ul class="absolute z-30 mt-1 max-h-52 w-full overflow-auto rounded-xl border border-slate-300 bg-white p-1 shadow-lg dark:border-slate-700 dark:bg-slate-900">
        @for (option of filteredOptions(); track option.id) {
          <li>
            <button
              type="button"
              class="w-full rounded-lg px-3 py-2 text-left text-sm text-slate-700 transition hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800"
              (mousedown)="selectOption(option)"
            >
              {{ option.nombre }}
            </button>
          </li>
        } @empty {
          <li class="px-3 py-2 text-sm text-slate-500 dark:text-slate-400">No se encontraron opciones</li>
        }
      </ul>
    }
  </div>
</label>
