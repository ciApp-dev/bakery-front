<article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
			<h2 class="mb-3 text-lg font-black text-slate-900 dark:text-slate-100">Cerrar Checkout</h2>

			<div class="space-y-3">
				
                <app-input-form
                label="Efectivo contado"
                type="decimal"
                placeholder="0.00"
				[color]="'border-slate-300 focus:border-amber-500 dark:border-slate-600 dark:focus:border-amber-400'"
                [value]="totalCash()"
                (keydown.F1)="onCashInputClick($event)"
                (valueChange)="calculateDifference($event)"
                ></app-input-form>
                <div>
                    
                </div>

				<div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
					<p class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Diferencia</p>
                    <p class="mt-1 text-base font-black text-slate-900 dark:text-slate-100">$ {{ difference().toFixed(2) }}</p>
				</div>

                <app-input-form
                label="Observaciones de cierre"
                type="textarea"
                placeholder="Comentario final de caja"
                [value]="observations()"
				[color]="'border-slate-300 focus:border-amber-500 dark:border-slate-600 dark:focus:border-amber-400'"
                (valueChange)="onObservationsChange($event)"
                ></app-input-form>

                <app-button-main-form
                iconName="save"
                label="Cerrar Actividad de Caja"
                type="submit"
                color="bg-slate-900 hover:bg-black dark:bg-emerald-600 dark:hover:bg-emerald-700 dark:text-white w-full"
                (click)="endActivity()"
                ></app-button-main-form>
			</div>

            @if(showModal()){
                <app-modal-deno-cash (close)="showModal.set(false)" (totalCashValue)="calculateDifference($event)"></app-modal-deno-cash>
            }
		</article>
