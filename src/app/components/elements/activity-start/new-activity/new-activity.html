<div class="mt-4 border border-slate-200/70 p-4 rounded-2xl P-4 sm:p-5">

    <div>

        <app-selector-form
            [label]="'Caja a aperturar'"
            [placeholder]="'Selecciona una caja'"
            [options]="optionsActivity()"
            [value]="form.controls['register'].value" (valueChange)="onRegisterChange($event)"
        ></app-selector-form>
        @if(form.controls['register'].invalid && form.controls['register'].touched) {
        <p class="mt-1 text-xs text-red-600">Seleccione una caja</p>
        }

        <app-input-form [label]="'Cantidad inicial'" [placeholder]="'Ingresa la cantidad con la que aperturas'"
            [type]="'decimal'" (valueChange)="onAmountChange($event)" [value]="form.controls['amount'].value"
            ></app-input-form>
        @if(form.controls['amount'].invalid && form.controls['amount'].touched) {
        <p class="mt-1 text-xs text-red-600">La cantidad debe ser mayor a 0</p>
        }


        <app-input-form [label]="'Observaciones'" [placeholder]="'Ingresa una observación para la apertura de caja'"
            [type]="'textarea'" (valueChange)="onObservationsChange($event)" [value]="form.controls['observations'].value"
            ></app-input-form>
    </div>


    <div class="mt-4 flex gap-2">
        <app-button-main-form [label]="'Iniciar actividad'" [iconName]="'start'" (pressed)="startNewActivity()"></app-button-main-form>
        <app-button-secundary-form [label]="'Cancelar'" [iconName]="'close'" [color]="'text-red-500'"
            (pressed)="cancelNewActivity()"></app-button-secundary-form>
    </div>


</div>
