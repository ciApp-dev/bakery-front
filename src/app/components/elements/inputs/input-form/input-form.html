<label class="block">
    <span class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">{{ label() }}</span>
    @if (type()==="decimal"){
    <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="0.00"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-slate-200 dark:focus:ring-slate-200/20" />
    }

    @if (type()==="number"){
    <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-slate-200 dark:focus:ring-slate-200/20" />
    }

    @if(type()==="textarea"){
    <textarea
        rows="4"
        placeholder="{{ placeholder() }}"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        class="w-full min-h-[5.5rem] rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-slate-200 dark:focus:ring-slate-200/20"
    ></textarea>
    }

    @if(type()!=="decimal" && type()!=="number" && type()!=="textarea"){
    <input type="text" inputmode="text" placeholder="{{ placeholder() }}"
        [value]="valueAsText()"
        (input)="onValueChange($event)"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-slate-900 focus:ring-2 focus:ring-slate-900/15 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-slate-200 dark:focus:ring-slate-200/20" />
    }

    
</label>
